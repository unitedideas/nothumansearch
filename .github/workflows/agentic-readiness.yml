name: Agentic Readiness
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - '.github/workflows/agentic-readiness.yml'
      - 'harness/README.md'
      - 'harness/discovery-quality-latest.json'
      - 'harness/discovery-quarantine-latest.json'
      - 'internal/models/queries.go'
      - 'internal/handlers/digest.go'
      - 'internal/handlers/fix.go'
      - 'internal/handlers/seo.go'
      - 'internal/handlers/mcp.go'
      - 'tools/discovery-quality-report.py'
      - 'tools/discovery-quarantine-report.py'
      - 'tools/quality-gate-discovery.py'
      - 'tools/taxonomy-other-redacted-sample.py'
      - 'tools/test-discovery-quality-report.py'
      - 'tools/test-discovery-quarantine-report.py'
      - 'tools/test-harness-verifier-contract.py'
      - 'tools/test-taxonomy-other-redacted-sample.py'
      - 'tools/test-full-recrawl-closeout.py'
      - 'tools/full-recrawl-closeout.py'
      - 'tools/quality-gate-discovery-test.py'
      - 'tools/test-refresh-discovery-quality.py'
      - 'tools/verify-harness-local.sh'
      - 'tools/fixtures/discovery-quarantine-ci.json'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: unitedideas/nhs-score-check-action@v1
        with:
          domain: nothumansearch.ai
          min-score: 95
  discovery-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run local harness verification
        run: |
          tools/verify-harness-local.sh
